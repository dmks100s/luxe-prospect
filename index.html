<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Luxe Prospect">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A0A0A">
<title>Luxe Prospect</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap');

:root {
  --gold: #C9A96E;
  --black: #0A0A0A;
  --dark: #0F0F0F;
  --card: #181818;
  --card2: #1F1F1F;
  --card3: #252525;
  --border: rgba(201,169,110,0.16);
  --borderLight: rgba(255,255,255,0.06);
  --text: #F2F0EB;
  --muted: #888580;
  --dim: #555250;
  --green: #48BB78;
  --red: #E05252;
  --amber: #EDA830;
  --blue: #5599D0;
  --purple: #9875C5;
  --insetTop: env(safe-area-inset-top, 44px);
  --insetBottom: env(safe-area-inset-bottom, 34px);
  --insetLeft: env(safe-area-inset-left, 0px);
  --insetRight: env(safe-area-inset-right, 0px);
  --tabBar: 56px;
  --topBar: 52px;
}

*, *::before, *::after {
  margin: 0; padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}

html {
  height: 100%;
  height: -webkit-fill-available;
  background: var(--black);
}

body {
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
  background: var(--black);
  color: var(--text);
  height: 100%;
  height: -webkit-fill-available;
  overflow: hidden;
  position: fixed;
  width: 100%;
  top: 0; left: 0;
  -webkit-font-smoothing: antialiased;
}

/* ── APP SHELL ── */
#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  height: -webkit-fill-available;
  background: var(--black);
}

/* ── TOP BAR ── */
#topbar {
  background: rgba(15,15,15,0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 0.5px solid var(--border);
  padding-top: calc(var(--insetTop) + 10px);
  padding-bottom: 12px;
  padding-left: calc(var(--insetLeft) + 16px);
  padding-right: calc(var(--insetRight) + 16px);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  position: relative;
  z-index: 50;
}

.tb-brand {
  flex: 1;
  font-family: 'Playfair Display', serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--gold);
  line-height: 1;
}

.tb-brand small {
  display: block;
  font-family: 'DM Sans', sans-serif;
  font-size: 9.5px;
  color: var(--dim);
  letter-spacing: 1.8px;
  text-transform: uppercase;
  font-weight: 600;
  margin-top: 2px;
}

.tb-title {
  flex: 1;
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  text-align: center;
}

.tb-back {
  background: none;
  border: none;
  color: var(--gold);
  font-size: 15px;
  font-weight: 500;
  font-family: 'DM Sans', sans-serif;
  padding: 6px 4px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 2px;
  flex-shrink: 0;
  white-space: nowrap;
}
.tb-back:active { opacity: 0.6; }

.tb-add {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--gold);
  border: none;
  color: var(--black);
  font-size: 22px;
  font-weight: 300;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.tb-add:active { opacity: 0.8; transform: scale(0.93); }

/* ── SCROLL AREA ── */
#scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
  background: var(--dark);
}

/* ── BOTTOM TAB BAR ── */
#tabs {
  background: rgba(15,15,15,0.97);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 0.5px solid var(--border);
  display: flex;
  align-items: stretch;
  height: calc(var(--tabBar) + var(--insetBottom));
  padding-bottom: var(--insetBottom);
  flex-shrink: 0;
  position: relative;
  z-index: 50;
}

.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 8px 4px 4px;
  cursor: pointer;
  position: relative;
  -webkit-user-select: none;
  user-select: none;
}
.tab:active { opacity: 0.65; }

.tab-icon { font-size: 22px; line-height: 1; }
.tab-txt { font-size: 10px; color: var(--dim); font-weight: 500; }
.tab.on .tab-txt { color: var(--gold); }
.tab.on .tab-icon { transform: scale(1.08); }

.tab-dot {
  position: absolute;
  top: 6px; right: calc(50% - 16px);
  background: var(--red);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  min-width: 15px;
  height: 15px;
  padding: 0 4px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.tab-dot.g { background: var(--gold); color: var(--black); }

/* ── SECTION HEADER ── */
.sec-hdr {
  padding: 14px 16px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sec-lbl {
  font-size: 11px;
  font-weight: 700;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 1.4px;
}
.sec-btn {
  font-size: 13px;
  color: var(--gold);
  font-weight: 600;
  background: none;
  border: none;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  padding: 2px 0;
}
.sec-btn:active { opacity: 0.6; }

/* ── STAT CARDS ── */
.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 14px 16px 10px;
}

.sc {
  background: var(--card);
  border: 0.5px solid var(--borderLight);
  border-radius: 16px;
  padding: 14px;
  position: relative;
  overflow: hidden;
}
.sc::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  border-radius: 16px 16px 0 0;
}
.sc.g::before { background: linear-gradient(90deg, var(--gold), transparent); }
.sc.b::before { background: linear-gradient(90deg, var(--blue), transparent); }
.sc.gr::before { background: linear-gradient(90deg, var(--green), transparent); }
.sc.a::before { background: linear-gradient(90deg, var(--amber), transparent); }

.sc-lbl {
  font-size: 9.5px;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 1.2px;
  font-weight: 700;
  margin-bottom: 7px;
}
.sc-val {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
  line-height: 1;
  margin-bottom: 3px;
}
.sc-sub { font-size: 11px; color: var(--muted); }

/* ── CARD LIST ── */
.card-block {
  background: var(--card);
  border-top: 0.5px solid var(--borderLight);
  border-bottom: 0.5px solid var(--borderLight);
  margin-bottom: 10px;
}

/* ── PROPERTY ROW ── */
.prop-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 16px;
  background: var(--card);
  border-bottom: 0.5px solid var(--borderLight);
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}
.prop-row:active { background: var(--card2); }
.prop-row:last-child { border-bottom: none; }

.prop-icon {
  width: 38px; height: 38px;
  border-radius: 10px;
  background: var(--card2);
  border: 0.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

.prop-body { flex: 1; min-width: 0; }
.prop-addr {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 3px;
}
.prop-name {
  font-size: 12.5px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 4px;
}
.prop-meta { display: flex; align-items: center; gap: 7px; }

.prop-chevron { color: var(--dim); font-size: 16px; flex-shrink: 0; }

/* ── BADGE ── */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 10.5px;
  font-weight: 600;
  white-space: nowrap;
}
.un { background: rgba(85,82,80,0.3); color: #888; }
.vm { background: rgba(85,153,208,0.2); color: var(--blue); }
.na { background: rgba(237,168,48,0.2); color: var(--amber); }
.cb { background: rgba(201,169,110,0.2); color: var(--gold); }
.it { background: rgba(72,187,120,0.22); color: var(--green); }
.ni { background: rgba(224,82,82,0.18); color: var(--red); }
.ap { background: rgba(152,117,197,0.22); color: var(--purple); }
.so { background: rgba(201,169,110,0.28); color: #E8D5B0; }
.se { background: rgba(85,153,208,0.18); color: var(--blue); }
.nd { background: rgba(40,40,40,0.5); color: var(--dim); }

/* ── SEARCH ── */
.search-wrap {
  background: var(--card);
  border-bottom: 0.5px solid var(--borderLight);
  padding: 12px 16px;
}
.search-inner {
  background: var(--card2);
  border: 0.5px solid var(--borderLight);
  border-radius: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
}
.search-inner input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  min-width: 0;
}
.search-inner input::placeholder { color: var(--dim); }
.search-icon { color: var(--dim); font-size: 16px; flex-shrink: 0; }

/* ── FILTER CHIPS ── */
.chips {
  display: flex;
  gap: 7px;
  padding: 10px 16px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  background: var(--card);
  border-bottom: 0.5px solid var(--borderLight);
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }

.chip {
  padding: 6px 13px;
  border-radius: 20px;
  font-size: 12.5px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  border: 0.5px solid var(--borderLight);
  background: var(--card2);
  color: var(--muted);
  flex-shrink: 0;
  -webkit-user-select: none;
}
.chip:active { opacity: 0.7; }
.chip.on { background: var(--gold); color: var(--black); border-color: var(--gold); font-weight: 600; }

/* ── DETAIL HERO ── */
.det-hero {
  background: linear-gradient(160deg, #1C1814 0%, #181510 100%);
  padding: 18px 16px 16px;
  border-bottom: 0.5px solid var(--border);
}
.det-addr {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
  line-height: 1.3;
}
.det-sub { font-size: 13px; color: var(--muted); margin-bottom: 12px; }

/* ── 4-BUTTON GRID ── */
.action-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 14px 16px;
}
.act-btn {
  background: var(--card);
  border: 0.5px solid var(--borderLight);
  border-radius: 14px;
  padding: 16px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  -webkit-appearance: none;
  font-family: 'DM Sans', sans-serif;
  transition: transform 0.1s;
}
.act-btn:active { transform: scale(0.95); opacity: 0.8; }
.act-btn.cl { border-color: rgba(72,187,120,0.3); background: rgba(72,187,120,0.06); }
.act-btn.sm { border-color: rgba(85,153,208,0.3); background: rgba(85,153,208,0.06); }
.act-btn.em { border-color: rgba(237,168,48,0.3); background: rgba(237,168,48,0.06); }
.act-btn.nt { border-color: rgba(152,117,197,0.3); background: rgba(152,117,197,0.06); }
.act-btn .ai { font-size: 28px; line-height: 1; }
.act-btn .al { font-size: 12.5px; font-weight: 600; color: var(--muted); }

/* ── INFO ROWS ── */
.info-blk {
  padding: 14px 16px;
  border-bottom: 0.5px solid var(--borderLight);
}
.info-blk-ttl {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 1.4px;
  margin-bottom: 12px;
}
.info-r {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 6px 0;
  border-bottom: 0.5px solid rgba(255,255,255,0.03);
}
.info-r:last-child { border-bottom: none; }
.ir-lbl {
  font-size: 11px;
  color: var(--dim);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  min-width: 56px;
  padding-top: 2px;
}
.ir-val { font-size: 14px; color: var(--text); flex: 1; }
.ir-val a { color: var(--gold); text-decoration: none; }

/* ── STATUS PICKER ── */
.status-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 16px;
  background: var(--card2);
  border-top: 0.5px solid var(--borderLight);
  border-bottom: 0.5px solid var(--borderLight);
  margin-bottom: 2px;
}
.status-row select {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  -webkit-appearance: none;
}
.status-row-lbl { font-size: 11.5px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

/* ── TIMELINE ── */
.tl-item {
  display: flex;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 0.5px solid var(--borderLight);
}
.tl-dot {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--card2);
  border: 0.5px solid var(--borderLight);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.tl-body { flex: 1; min-width: 0; }
.tl-type { font-size: 13.5px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
.tl-time { font-size: 11.5px; color: var(--dim); margin-bottom: 5px; }
.tl-note {
  font-size: 13px;
  color: var(--muted);
  background: var(--card2);
  border-left: 2px solid var(--border);
  padding: 8px 12px;
  border-radius: 0 8px 8px 0;
  font-style: italic;
  line-height: 1.5;
}

/* ── MODAL (iOS sheet) ── */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.72);
  z-index: 999;
  display: flex;
  align-items: flex-end;
  -webkit-backdrop-filter: blur(3px);
  backdrop-filter: blur(3px);
}

.sheet {
  background: var(--card);
  border-top: 0.5px solid var(--border);
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-height: 93vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: calc(var(--insetBottom) + 10px);
  padding-left: var(--insetLeft);
  padding-right: var(--insetRight);
}

.sh-handle {
  width: 36px; height: 4px;
  background: rgba(255,255,255,0.15);
  border-radius: 2px;
  margin: 10px auto 6px;
}

.sh-hdr {
  padding: 6px 18px 14px;
  border-bottom: 0.5px solid var(--borderLight);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}
.sh-ttl { font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 600; color: var(--text); }
.sh-sub { font-size: 12.5px; color: var(--dim); margin-top: 3px; }

.sh-close {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--card2);
  border: 0.5px solid var(--borderLight);
  color: var(--muted);
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  -webkit-appearance: none;
}
.sh-close:active { opacity: 0.7; }

.sh-body { padding: 18px; }
.sh-foot {
  padding: 12px 18px;
  display: flex;
  gap: 10px;
}

/* ── FORMS ── */
.fg { margin-bottom: 16px; }
.fl {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 8px;
}
.fi, .fsel, .fta {
  width: 100%;
  background: var(--card2);
  border: 0.5px solid var(--borderLight);
  border-radius: 12px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  padding: 12px 14px;
  outline: none;
  -webkit-appearance: none;
  transition: border-color 0.15s;
}
.fi:focus, .fsel:focus, .fta:focus { border-color: var(--gold); }
.fta { resize: none; line-height: 1.5; }

/* ── BUTTONS ── */
.btn {
  padding: 13px 18px;
  border-radius: 13px;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  -webkit-appearance: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn:active { opacity: 0.8; transform: scale(0.97); }
.btn-g { background: var(--gold); color: var(--black); flex: 1; }
.btn-o { background: var(--card2); border: 0.5px solid var(--borderLight); color: var(--muted); padding: 13px 16px; }
.btn-grn { background: var(--green); color: #fff; flex: 1; }

/* ── CALL OUTCOME GRID ── */
.oc-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}
.oc {
  padding: 11px 6px;
  background: var(--card2);
  border: 1.5px solid var(--borderLight);
  border-radius: 12px;
  text-align: center;
  cursor: pointer;
  -webkit-appearance: none;
  transition: border-color 0.12s, background 0.12s;
}
.oc:active { transform: scale(0.94); }
.oc.on { border-color: var(--gold); background: rgba(201,169,110,0.1); }
.oc .oi { font-size: 20px; display: block; margin-bottom: 4px; }
.oc .ol { font-size: 11px; font-weight: 600; color: var(--muted); }
.oc.on .ol { color: var(--gold); }

/* ── SMS TEMPLATES ── */
.sms-t {
  background: var(--card2);
  border: 1.5px solid var(--borderLight);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 9px;
  cursor: pointer;
}
.sms-t.on { border-color: var(--gold); background: rgba(201,169,110,0.07); }
.sms-t-nm { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.sms-t-pv { font-size: 12px; color: var(--muted); line-height: 1.5; }

/* ── CALL BANNER ── */
.call-banner {
  display: flex;
  align-items: center;
  gap: 14px;
  background: rgba(72,187,120,0.08);
  border: 0.5px solid rgba(72,187,120,0.28);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 16px;
  text-decoration: none;
}
.call-info { flex: 1; }
.call-who { font-size: 12px; color: var(--dim); display: block; margin-bottom: 2px; }
.call-num { font-family: monospace; font-size: 19px; color: var(--green); font-weight: 600; }
.call-dial { background: var(--green); color: #fff; padding: 10px 18px; border-radius: 11px; font-size: 14px; font-weight: 700; white-space: nowrap; }

/* ── APPT CARD ── */
.appt-r {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 13px 16px;
  background: var(--card);
  border-bottom: 0.5px solid var(--borderLight);
}
.appt-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 5px;
}
.appt-dot.cf { background: var(--green); box-shadow: 0 0 6px rgba(72,187,120,0.5); }
.appt-dot.cx { background: var(--red); }
.appt-body { flex: 1; min-width: 0; }
.appt-addr { font-size: 13.5px; font-weight: 600; color: var(--text); }
.appt-nm { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.appt-dt { font-size: 11.5px; color: var(--dim); margin-top: 3px; }
.ibt {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: var(--card2);
  border: 0.5px solid var(--borderLight);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  cursor: pointer;
  flex-shrink: 0;
  -webkit-appearance: none;
}
.ibt:active { background: var(--card3); }

/* ── PROGRESS ROW ── */
.pr {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 0;
  border-bottom: 0.5px solid rgba(255,255,255,0.02);
}
.pr:last-child { border-bottom: none; }
.pr-lbl { font-size: 12.5px; color: var(--muted); flex: 1; }
.pr-bar { flex: 2; height: 3.5px; background: var(--card3); border-radius: 2px; overflow: hidden; }
.pr-fill { height: 100%; border-radius: 2px; }
.pr-num { font-size: 11.5px; color: var(--dim); min-width: 26px; text-align: right; font-variant-numeric: tabular-nums; }

/* ── STREET ROW ── */
.street-r {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 16px;
  background: var(--card);
  border-bottom: 0.5px solid var(--borderLight);
  cursor: pointer;
}
.street-r:active { background: var(--card2); }
.str-nm { font-size: 13.5px; font-weight: 600; color: var(--text); flex: 1; }
.str-cnt { font-size: 13px; color: var(--muted); }

/* ── EMPTY STATE ── */
.empty {
  text-align: center;
  padding: 64px 24px;
}
.empty-ico { font-size: 46px; opacity: 0.25; margin-bottom: 14px; }
.empty-ttl { font-size: 16px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
.empty-sub { font-size: 13.5px; color: var(--dim); line-height: 1.6; }

/* ── DIVIDER ── */
.sticky-hdr {
  padding: 10px 16px 7px;
  font-size: 10.5px;
  font-weight: 700;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  background: var(--dark);
  border-bottom: 0.5px solid var(--borderLight);
  position: sticky;
  top: 0;
  z-index: 5;
}

/* ── TOAST ── */
#toast {
  position: fixed;
  bottom: calc(var(--tabBar) + var(--insetBottom) + 12px);
  left: 16px; right: 16px;
  background: var(--card);
  border: 0.5px solid var(--border);
  border-radius: 14px;
  padding: 13px 16px;
  font-size: 14px;
  color: var(--text);
  box-shadow: 0 6px 24px rgba(0,0,0,0.55);
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 9999;
  transform: translateY(12px);
  opacity: 0;
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events: none;
}
#toast.on { transform: translateY(0); opacity: 1; }

/* scrollbar hide */
* { scrollbar-width: none; }
*::-webkit-scrollbar { display: none; }

</style>
</head>

/* ── STATE ── */
const S = {
  page: 'dash',
  prev: 'props',
  propId: null,
  f: { q: '', status: '', street: '' },
  pgSize: 40,
  props: null,
  ix: null
};

function props() {
  if (!S.props) {
    const ov = JSON.parse(localStorage.getItem('lp3') || '{}');
    S.props = DB_PROPERTIES.map(p => ov[p.id] ? { ...p, ...ov[p.id] } : { ...p });
  }
  return S.props;
}

function saveProps() {
  const ov = {};
  props().forEach(p => {
    const o = DB_PROPERTIES.find(x => x.id === p.id);
    if (o) {
      const d = {};
      ['status','notes','lastContact','email','phone'].forEach(k => { if (p[k] !== o[k]) d[k] = p[k]; });
      if (Object.keys(d).length) ov[p.id] = d;
    }
  });
  localStorage.setItem('lp3', JSON.stringify(ov));
}

function ix() {
  if (!S.ix) S.ix = JSON.parse(localStorage.getItem('li3') || '[]');
  return S.ix;
}
function saveIx() { localStorage.setItem('li3', JSON.stringify(ix())); }

/* ── NAV ── */
function go(page, skipPrev) {
  if (!skipPrev) S.prev = S.page;
  S.page = page;

  ['dash','props','hot','appt','log'].forEach(t => {
    const el = document.getElementById('t-' + t);
    if (el) el.classList.toggle('on', t === page);
  });

  const tb = document.getElementById('topbar');
  if (page === 'detail') {
    const p = props().find(x => x.id === S.propId);
    tb.innerHTML = `
      <button class="tb-back" onclick="go('${S.prev}',true)">‹ Back</button>
      <div class="tb-title" style="font-size:13px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p ? p.street : ''}</div>
      <div style="width:60px"></div>`;
  } else if (page === 'streets') {
    tb.innerHTML = `
      <button class="tb-back" onclick="go('props',true)">‹ Properties</button>
      <div class="tb-title">Streets</div>
      <div style="width:60px"></div>`;
  } else if (page === 'dash') {
    tb.innerHTML = `
      <div class="tb-brand">Luxe Properties<small>Melbourne</small></div>
      <button class="tb-add" onclick="showAddModal()">+</button>`;
  } else {
    const titles = { props: 'Properties', hot: '🔥 Hot List', appt: 'Appointments', log: 'Call Log' };
    tb.innerHTML = `
      <div class="tb-title">${titles[page] || page}</div>
      <div style="width:34px"></div>`;
  }

  document.getElementById('scroll').scrollTop = 0;
  S.pgSize = 40;

  const renders = { dash: rDash, props: rProps, hot: rHot, appt: rAppt, log: rLog, streets: rStreets, detail: rDetail };
  if (renders[page]) renders[page]();
  badges();
}

function openProp(id) { S.propId = id; go('detail'); }

/* ── RENDER HELPERS ── */
const esc = s => (s || '').replace(/'/g, "\'").replace(/"/g, '&quot;');
const sClass = s => ({ uncontacted:'un', voicemail:'vm', no_answer:'na', callback:'cb', interested:'it', not_interested:'ni', appointment:'ap', sold:'so', no_data:'nd', sent:'se', noted:'se', connected:'it' }[s] || 'un');
const sEmoji = s => ({ uncontacted:'⬜', voicemail:'📵', no_answer:'🔕', callback:'🔄', interested:'⭐', not_interested:'✗', appointment:'📅', sold:'✅', no_data:'❓' }[s] || '⬜');
const statusOpts = ['uncontacted','voicemail','no_answer','callback','interested','not_interested','appointment','sold'];
function selOpts(cur) {
  return statusOpts.map(s => `<option value="${s}" ${cur===s?'selected':''}>${s.replace(/_/g,' ')}</option>`).join('');
}

/* ── DASHBOARD ── */
function rDash() {
  const pp = props();
  const total = pp.length;
  const contacted = pp.filter(p => !['uncontacted','no_data'].includes(p.status)).length;
  const interested = pp.filter(p => ['interested','appointment'].includes(p.status)).length;
  const confirmed = DB_APPOINTMENTS.filter(a => a.status === 'CONFIRMED').length;
  const week = ix().filter(i => Date.now() - new Date(i.date) < 604800000).length;

  const sc = {};
  pp.forEach(p => { sc[p.status] = (sc[p.status] || 0) + 1; });

  const stc = {};
  pp.forEach(p => { stc[p.street] = (stc[p.street] || 0) + 1; });
  const topSt = Object.entries(stc).sort((a,b) => b[1]-a[1]).slice(0,5);

  const clrs = { uncontacted:'#555250', voicemail:'#5599D0', no_answer:'#EDA830', callback:'#C9A96E', interested:'#48BB78', not_interested:'#E05252', appointment:'#9875C5', sold:'#C9A96E' };
  const lbls = { uncontacted:'Uncontacted', voicemail:'Voicemail', no_answer:'No Answer', callback:'Callback', interested:'Interested', not_interested:'Not Interested', appointment:'Appointment', sold:'Sold' };

  el('scroll').innerHTML = `
    <div class="stats">
      <div class="sc g"><div class="sc-lbl">Properties</div><div class="sc-val">${total.toLocaleString()}</div><div class="sc-sub">${DB_STREETS.length} streets</div></div>
      <div class="sc b"><div class="sc-lbl">Contacted</div><div class="sc-val">${contacted}</div><div class="sc-sub">${Math.round(contacted/total*100)}% coverage</div></div>
      <div class="sc gr"><div class="sc-lbl">Interested</div><div class="sc-val">${interested}</div><div class="sc-sub">${confirmed} confirmed appts</div></div>
      <div class="sc a"><div class="sc-lbl">This Week</div><div class="sc-val">${week}</div><div class="sc-sub">interactions</div></div>
    </div>

    <div class="card-block">
      <div class="info-blk-ttl" style="padding:14px 16px 6px">Contact Status</div>
      <div style="padding:4px 16px 14px">
        ${Object.entries(clrs).filter(([s]) => sc[s]).map(([s,c]) => `
          <div class="pr">
            <div class="pr-lbl">${lbls[s]}</div>
            <div class="pr-bar"><div class="pr-fill" style="width:${Math.round((sc[s]||0)/total*100)}%;background:${c}"></div></div>
            <div class="pr-num" style="color:${c}">${sc[s]||0}</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="card-block">
      <div style="padding:14px 16px 6px;display:flex;align-items:center;justify-content:space-between">
        <div class="info-blk-ttl">Top Streets</div>
        <button class="sec-btn" onclick="go('streets')">All →</button>
      </div>
      <div style="padding:0 16px 14px">
        ${topSt.map(([s,c]) => `
          <div class="pr" style="cursor:pointer" onclick="filterStreet('${esc(s)}')">
            <div class="pr-lbl" style="color:var(--text)">${s}</div>
            <div class="pr-bar"><div class="pr-fill" style="width:${Math.round(c/topSt[0][1]*100)}%;background:var(--gold)"></div></div>
            <div class="pr-num">${c}</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="card-block">
      <div style="padding:14px 16px 8px;display:flex;align-items:center;justify-content:space-between">
        <div class="info-blk-ttl">Upcoming Appointments</div>
        <button class="sec-btn" onclick="go('appt')">All →</button>
      </div>
      ${DB_APPOINTMENTS.filter(a => a.status === 'CONFIRMED').slice(0,4).map(a => `
        <div style="display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:0.5px solid var(--borderLight)">

  `;
}

/* ── PROPERTIES ── */
function filtered() {
  let pp = props();
  const { q, status, street } = S.f;
  if (street) pp = pp.filter(p => p.street === street);
  if (status) pp = pp.filter(p => p.status === status);
  if (q) { const lq = q.toLowerCase(); pp = pp.filter(p => p.address.toLowerCase().includes(lq) || p.fullName.toLowerCase().includes(lq) || (p.phone||'').includes(lq)); }
  return pp;
}

function rProps() {
  const ff = filtered();
  const page = ff.slice(0, S.pgSize);
  const more = ff.length > S.pgSize;

  el('scroll').innerHTML = `
    <div class="search-wrap">
      <div class="search-inner">
        <span class="search-icon">⌕</span>
        <input type="search" placeholder="Search address, name, phone…" value="${esc(S.f.q)}"
          oninput="applyF('q',this.value)" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none">
      </div>
    </div>
    <div class="chips">
      <div class="chip ${!S.f.status?'on':''}" onclick="applyF('status','')">All&nbsp;${props().length}</div>
      ${[['uncontacted','Uncontacted'],['voicemail','Voicemail'],['no_answer','No Answer'],['callback','Callback'],['interested','⭐ Interested'],['not_interested','Not Interested'],['appointment','📅 Booked']].map(([v,l]) => `<div class="chip ${S.f.status===v?'on':''}" onclick="applyF('status','${v}')">${l}</div>`).join('')}
      ${S.f.street ? `<div class="chip on" onclick="applyF('street','')">📍 ${S.f.street} ×</div>` : ''}
    </div>
    <div style="padding:8px 16px;font-size:12px;color:var(--dim);background:var(--dark);border-bottom:0.5px solid var(--borderLight);display:flex;justify-content:space-between;align-items:center">
      <span>${ff.length.toLocaleString()} properties</span>
      <button class="sec-btn" onclick="go('streets')">By Street →</button>
    </div>
    ${page.length === 0
      ? `<div class="empty"><div class="empty-ico">🔍</div><div class="empty-ttl">No results</div><div class="empty-sub">Try a different search or clear filters</div></div>`
      : page.map(p => `
        <div class="prop-row" onclick="openProp(${p.id})">
          <div class="prop-icon">${sEmoji(p.status)}</div>
          <div class="prop-body">
            <div class="prop-addr">${p.address}</div>
            <div class="prop-name">${p.fullName || '<em style="color:var(--dim)">Unknown owner</em>'}</div>
            <div class="prop-meta">
              <span class="badge ${sClass(p.status)}">${p.status.replace(/_/g,' ')}</span>
              ${p.phone ? `<span style="font-size:11.5px;color:var(--dim);font-family:monospace">${p.phone}</span>` : ''}
            </div>
          </div>
          <div class="prop-chevron">›</div>
        </div>`).join('')}
    ${more ? `
      <div style="padding:14px 16px;border-top:0.5px solid var(--borderLight)">
        <button onclick="loadMore()" class="btn btn-o" style="width:100%;justify-content:center;font-size:14px">
          Load more (${ff.length - S.pgSize} remaining)
        </button>
      </div>` : ''}
    <div style="height:16px"></div>
  `;
}

function loadMore() { S.pgSize += 40; rProps(); const s = el('scroll'); s.scrollTop = s.scrollHeight - 500; }
function applyF(k, v) { S.f[k] = v; S.pgSize = 40; rProps(); }
function filterStreet(s) { S.f.street = s; S.f.status = ''; S.f.q = ''; S.pgSize = 40; go('props'); }

/* ── MODAL ── */
function showSheet(html) {
  const d = document.createElement('div');
  d.className = 'overlay';
  d.id = 'modal';
  d.innerHTML = html;
  d.addEventListener('click', e => { if (e.target === d) closeSheet(); });
  document.body.appendChild(d);
}
function closeSheet() { const m = document.getElementById('modal'); if (m) m.remove(); }

function callPhone(phone, name, address, propId) {
  showSheet(`
    <div class="sheet">
      <div class="sh-handle"></div>
      <div class="sh-hdr">
        <div><div class="sh-ttl">📞 Log Call</div><div class="sh-sub">${address}</div></div>

              <div class="oc ${v==='voicemail'?'on':''}" id="oc-${v}" onclick="pickOc('${v}')">                <span class="oi">${ic}</span><span class="ol">${lb}</span>
              </div>`).join('')}

        </div>
        <div class="fg">
          <div class="fl">Notes</div>
          <textarea class="fta" id="cn" placeholder="What did they say? Key details…" style="min-height:80px"></textarea>
        </div>
        <div class="fg">
          <div class="fl">Next Action</div>
          <input class="fi" id="cnx" placeholder="e.g. Call back in 2 weeks…">
        </div>
      </div>
      <div class="sh-foot">
        <button class="btn btn-o" onclick="closeSheet()">Cancel</button>
        <button class="btn btn-g" onclick="saveCall('${esc(phone||'')}','${esc(name||'')}','${esc(address||'')}',${propId||'null'})">Save Log</button>
      </div>
    </div>
  `);
  W.oc = 'voicemail';
}

const W = window;
W.pickOc = v => {
  document.querySelectorAll('.oc').forEach(e => e.classList.remove('on'));
  const el2 = document.getElementById('oc-'+v);
  if (el2) el2.classList.add('on');
  W.oc = v;
};

function saveCall(phone, name, address, propId) {
  const outcome = W.oc || 'voicemail';
  const notes = document.getElementById('cn').value;
  const nxt = document.getElementById('cnx').value;
  ix().push({ id: Date.now(), type:'call', propertyId:propId, address, name, phone, outcome, notes: notes+(nxt?'\nNext: '+nxt:''), date:new Date().toISOString() });
  saveIx();
  if (propId) {
    const p = props().find(x => x.id === propId);
    if (p) { p.status = outcome; p.lastContact = new Date().toISOString(); if (notes) p.notes = notes; saveProps(); }
  }
  closeSheet();
  toast('Call logged · ' + outcome.replace(/_/g,' '));
  if (S.page === 'detail') rDetail();
  badges();
  if (['voicemail','connected','interested','callback'].includes(outcome) && phone) {
    setTimeout(() => { if (confirm('Send SMS follow-up?')) openSMS(phone, name, address, propId); }, 250);
  }
}

/* ── SMS MODAL ── */
function openSMS(phone, name, address, propId) {
  const fn = (name||'').split(' ')[0] || 'there';
  const tmpls = [
    { n:'Market Update', t:`Hi ${fn}, it's Alex from Luxe Properties Melbourne. Properties in your area have been selling really well lately. If you've been thinking about selling, I'd love to chat about what your home could achieve right now. Happy to pop by for a no-obligation chat anytime. – Alex 📱` },
    { n:'Home Value Check', t:`Hi ${fn}, Alex here from Luxe Properties. I've noticed some strong sales near your property recently and wanted to reach out. I can provide you with an up-to-date appraisal at no cost – would you be open to a quick call? – Alex` },
    { n:'Voicemail Follow-Up', t:`Hi ${fn}, Alex Doguluer from Luxe Properties Melbourne. I tried calling earlier – no worries! I specialise in your area and would love to share some market insights when you get a chance. Feel free to call or text back anytime. – Alex` },
    { n:'Introduction', t:`Hi ${fn}, my name is Alex from Luxe Properties Melbourne. I work closely with homeowners in your area and wanted to introduce myself. If you ever want to know what your home is worth or just need local property advice, I'm always happy to help. – Alex` }
  ];
  showSheet(`
    <div class="sheet">
      <div class="sh-handle"></div>
      <div class="sh-hdr">
        <div><div class="sh-ttl">💬 Send SMS</div><div class="sh-sub">${name||'Owner'} · ${phone||'No phone'}</div></div>
        <button class="sh-close" onclick="closeSheet()">✕</button>
      </div>
      <div class="sh-body">
        <div class="fg">
          <div class="fl">Template</div>
          ${tmpls.map((t,i) => `<div class="sms-t ${i===0?'on':''}" id="st-${i}" onclick="pickTmpl(${i})"><div class="sms-t-nm">${t.n}</div><div class="sms-t-pv">${t.t.substring(0,70)}…</div></div>`).join('')}
        </div>
        <div class="fg">
          <div class="fl">Message <span id="slen" style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--dim)">0 chars</span></div>
          <textarea class="fta" id="smstxt" style="min-height:120px" oninput="updSmsLen()">${tmpls[0].t}</textarea>
        </div>
      </div>
      <div class="sh-foot">
        <button class="btn btn-o" onclick="closeSheet()">Cancel</button>
        ${phone
          ? `<a class="btn btn-g" id="sms-link" href="sms:${phone}?body=${encodeURIComponent(tmpls[0].t)}" onclick="logSMS('${esc(phone)}','${esc(name)}','${esc(address)}',${propId||'null'})">Open Messages →</a>`
          : `<button class="btn btn-g" disabled style="opacity:0.35">No phone number</button>`}
      </div>
    </div>
  `);
  W._tmpls = tmpls; W._smsPhone = phone;
  updSmsLen();
}

W.pickTmpl = i => {
  document.querySelectorAll('.sms-t').forEach(e => e.classList.remove('on'));
  const st = document.getElementById('st-'+i);
  if (st) st.classList.add('on');
  const ta = document.getElementById('smstxt');
  ta.value = W._tmpls[i].t;
  updSmsLen();
};

W.updSmsLen = () => {
  const ta = document.getElementById('smstxt');
  if (!ta) return;
  document.getElementById('slen').textContent = ta.value.length + ' chars';
  const lnk = document.getElementById('sms-link');
  if (lnk) lnk.href = `sms:${W._smsPhone}?body=${encodeURIComponent(ta.value)}`;
};

function logSMS(phone, name, address, propId) {
  const txt = (document.getElementById('smstxt')||{}).value || '';
  ix().push({ id:Date.now(), type:'sms', propertyId:propId, address, name, phone, outcome:'sent', notes:txt.substring(0,120), date:new Date().toISOString() });
  saveIx(); closeSheet(); toast('SMS opened in Messages'); badges();
}

/* ── UTILS ── */
function el(id) { return document.getElementById(id); }

function updStatus(propId, v) {
  const p = props().find(x => x.id === propId);
  if (p) { p.status = v; p.lastContact = new Date().toISOString(); saveProps(); toast('Status: ' + v.replace(/_/g,' ')); }
}

function toast(msg) {
  const t = el('toast');
  t.innerHTML = '✓ ' + msg;
  t.classList.add('on');
  clearTimeout(W._toast);
  W._toast = setTimeout(() => t.classList.remove('on'), 2600);
}

function badges() {
  const pp = props();
  el('bd-props').textContent = pp.length.toLocaleString();
  el('bd-hot').textContent = DB_HOT_LIST.length;
  const cf = DB_APPOINTMENTS.filter(a => a.status === 'CONFIRMED').length;
  const ab = el('bd-appt');
  ab.textContent = cf; ab.style.display = cf ? '' : 'none';
  const ixl = ix().length;
  const lb = el('bd-log');
  lb.textContent = ixl; lb.style.display = ixl ? '' : 'none';
}

/* ── INIT ── */
go('dash');
</script>
